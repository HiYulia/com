<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yulia Niu</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <style>
      .articles-grid {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 4rem;
        margin: 2rem auto;
        max-width: 1200px;
        padding: 0 2rem;
      }

      .article-card {
        flex: 0 1 auto;
        width: 220px;
      }

      .platform-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        border-radius: 10px;
        width: 100%;
        min-height: 160px;
        box-sizing: border-box;
        background-color: #ffffff;
        border: 1px solid #eaeaea;
        transition: all 0.2s ease-out;
      }

      .platform-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background-color: #f8f8f8;
        margin-bottom: 1.2rem;
        transition: all 0.2s ease-out;
      }

      .fa-medium {
        font-size: 2.5rem;
      }

      .fa-book {
        font-size: 2rem;
      }

      .fa-newspaper {
        font-size: 2rem;
      }

      .platform-name {
        font-size: 1.1rem;
        color: #555;
        font-weight: 500;
        text-align: center;
        margin: 0;
        padding: 0;
        transition: all 0.2s ease-out;
        white-space: nowrap;
      }

      .platform-wrapper:hover {
        transform: translateY(-2px);
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.06);
        border-color: #e0e0e0;
        background-color: #fafafa;
      }

      .platform-wrapper:hover .platform-icon {
        background-color: #ffffff;
        color: #000;
      }

      .platform-wrapper:hover .platform-name {
        color: #333;
      }

      .article-link {
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="hero">
      <h1>Yulia Niu</h1>
      <p class="slogan">Creativity Generates Values</p>
      <div class="profile-image">
        <img src="images/profile.jpg" alt="Yulia Niu" id="profile-pic" />
      </div>
    </div>

    <main>
      <section id="articles">
        <h2>Insights/观点</h2>
          <div class="article-card">
            <div class="article-content">
              <a
                href="https://www.jianshu.com/u/71bca0535643"
                target="_blank"
                rel="noopener"
                class="article-link"
              >
                <div class="platform-wrapper">
                  <div class="platform-icon">
                    <i class="fas fa-book"></i>
                  </div>
                  <span class="platform-name">简书</span>
                </div>
              </a>
            </div>
          </div>
          <div class="article-card">
            <div class="article-content">
              <a
                href="https://substack.com/@yulianiu"
                target="_blank"
                rel="noopener"
                class="article-link"
              >
                <div class="platform-wrapper">
                  <div class="platform-icon">
                    <i class="fas fa-newspaper"></i>
                  </div>
                  <span class="platform-name">Substack</span>
                </div>
              </a>
            </div>
          </div>
        </div>
      </section>

      <section id="projects">
        <h2>Projects/项目</h2>
        <div class="projects-grid">
          <div class="project-card">
            <div class="project-content">
              <h3>Graduate/研究生</h3>
              <a
                href="https://xyniu0829.wixsite.com/yulia/copy-of-ds-cases"
                target="_blank"
                rel="noopener"
                class="project-link"
              >
                Details
              </a>
            </div>
          </div>
          <div class="project-card">
            <div class="project-content">
              <h3>undergraduate/本科</h3>
              <a
                href="https://xyniu0829.wixsite.com/yulia/blank-q17v5"
                target="_blank"
                rel="noopener"
                class="project-link"
              >
                Details
              </a>
            </div>
          </div>
        </div>
      </section>

      <section id="contact">
        <h2>Contact Me/联系我</h2>
        <div class="contact-info">
          <div class="contact-icons">
            <a
              href="mailto:yulianiu@outlook.com"
              class="contact-link icon-link"
            >
              <i class="fas fa-envelope"></i>
              <span class="tooltip">yulianiu@outlook.com</span>
            </a>
            <a
              href="https://www.linkedin.com/in/yulianiu"
              target="_blank"
              rel="noopener"
              class="contact-link icon-link"
            >
              <i class="fab fa-linkedin"></i>
              <span class="tooltip">LinkedIn</span>
            </a>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <p>&copy; 2024 Yulia Niu. All rights reserved.</p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
